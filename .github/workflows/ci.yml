# Runs pysanoid's tests and ruff on every push and pull request, under Python 3.11, the only version the project is
# tested on. The comparison with sanoid's Perl (dev/run.py) is left to a local run; see CONTRIBUTING.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==9.2.0 ruff==0.17.3
      - run: ruff check .
      - run: python -m pytest test_pysanoid.py test_pysanoid_alert.py
