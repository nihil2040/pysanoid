# An example sanoid.conf. pysanoid reads the same files as upstream sanoid: copy this file and
# sanoid.defaults.conf to /etc/pysanoid/ (or the directory --configdir names) and edit the sections below.
#
# A section is named after a dataset, with no leading slash. A section named template_<name> holds settings
# that the sections naming it in use_template share; a section's own settings win over its templates'.

[tank/home]
	use_template = home
	recursive = yes

[tank/media]
	use_template = media

[tank/vm]
	use_template = home

[tank/backup]
	use_template = home
	# prune only once the pool is more than 85% full
	prune_defer = 85

[zroot/var/db]
	use_template = system

#############################
# templates below this line #
#############################

[template_home]
	frequently = 0
	hourly = 0
	daily = 7
	weekly = 5
	monthly = 12
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_media]
	frequently = 0
	hourly = 12
	daily = 7
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_system]
	frequently = 0
	hourly = 0
	daily = 7
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes
