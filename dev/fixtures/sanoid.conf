# A production-shaped config for the dev/ targets that run a whole config: diff_whole_run.py, check_overlap.py,
# simulate_long_horizon.py and simulate_trouble.py. Two pools, a recursive section, an encrypted tree, prune_defer on
# one dataset and hourlies on another. Keep its shape: the targets' dataset lists and seeds follow it.

[tank/software]
	use_template = software
	recursive = yes

[tank/encrypted/archive]
	use_template = software

[tank/encrypted/backup]
	use_template = home
	prune_defer = 85

[tank/encrypted/home/alice]
	use_template = home

[tank/encrypted/home/bob]
	use_template = home

[tank/vm]
    use_template = home

[tank/media]
	use_template = media

[zroot/media]
	use_template = system

[zroot/db]
	use_template = system

[zroot/dns]
	use_template = system

[zroot/bin]
	use_template = system

[zroot/docker]
	use_template = system

[zroot/home]
	use_template = system

